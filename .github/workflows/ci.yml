name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps
      - uses: nrwl/nx-set-shas@v5

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: npx nx record -- echo Hello World
      # When you enable task distribution, run the e2e-ci task instead of e2e
      - run: npx nx affected -t lint test build e2e
      - run: npx nx affected -t lint test build
      # Include the task you ran locally, to make sure we get our cache hit. You can remove this later.
      - run: npx nx build kaos-website--monorepo
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()

  deploy:
    name: Deploy to O2switch
    needs: main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      O2SWITCH_HOST: ${{ secrets.O2SWITCH_HOST }}
      O2SWITCH_PORT: ${{ secrets.O2SWITCH_PORT || 22 }}
      O2SWITCH_USER: ${{ secrets.O2SWITCH_USER }}
      O2SWITCH_APP_PATH: ${{ secrets.O2SWITCH_APP_PATH }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.O2SWITCH_SSH_KEY }}

      - name: Configure SSH host verification
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.O2SWITCH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build production SSR application
        run: npx nx build kaos-website--monorepo --configuration=production

      - name: Prepare remote application directory
        run: |
          ssh -p "${O2SWITCH_PORT}" "${O2SWITCH_USER}@${O2SWITCH_HOST}" \
            "mkdir -p '${O2SWITCH_APP_PATH}/dist' '${O2SWITCH_APP_PATH}/tmp'"

      - name: Upload application
        run: |
          rsync -az --delete \
            -e "ssh -p ${O2SWITCH_PORT}" \
            dist/kaos-website--monorepo/ \
            "${O2SWITCH_USER}@${O2SWITCH_HOST}:${O2SWITCH_APP_PATH}/dist/kaos-website--monorepo/"
          rsync -az \
            -e "ssh -p ${O2SWITCH_PORT}" \
            app.cjs package.json package-lock.json \
            "${O2SWITCH_USER}@${O2SWITCH_HOST}:${O2SWITCH_APP_PATH}/"

      - name: Install production dependencies and restart Passenger
        run: |
          ssh -p "${O2SWITCH_PORT}" "${O2SWITCH_USER}@${O2SWITCH_HOST}" \
            "cd '${O2SWITCH_APP_PATH}' && npm ci --omit=dev --ignore-scripts && touch tmp/restart.txt"
